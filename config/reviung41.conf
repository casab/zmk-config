# RGB underglow. CONFIG_WS2812_STRIP is deprecated and no longer set here.
CONFIG_ZMK_RGB_UNDERGLOW=y
# Turn the LEDs off after 30 s without a keypress (CONFIG_ZMK_IDLE_TIMEOUT); any key turns them back on.
CONFIG_ZMK_RGB_UNDERGLOW_AUTO_OFF_IDLE=y

# Deep sleep after 15 minutes without a keypress (CONFIG_ZMK_IDLE_SLEEP_TIMEOUT, default 900000 ms).
# Any key wakes it; that key isn't typed. Never sleeps while USB power is present.
CONFIG_ZMK_SLEEP=y

# Bluetooth transmit power +8 dBm: better range, more battery use.
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# Experimental BLE: CONN turns off 2M PHY for steadier connections; SEC turns on passkey pairing
# (type the 6 digits the computer shows, then Enter) and lets a computer re-pair to its own
# profile without BT CLR. After enabling, every computer has to be paired again.
CONFIG_ZMK_BLE_EXPERIMENTAL_FEATURES=y

# AutoSwitch KVM: the AutoSwitch app may select the Bluetooth profile when the KVM switches.
CONFIG_ZMK_AUTOSWITCH=y
