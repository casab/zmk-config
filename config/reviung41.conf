# RGB underglow. CONFIG_WS2812_STRIP is deprecated and no longer set here.
CONFIG_ZMK_RGB_UNDERGLOW=y

# Bluetooth transmit power +8 dBm: better range, more battery use.
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# AutoSwitch KVM: the AutoSwitch app may select the Bluetooth profile when the KVM switches.
CONFIG_ZMK_AUTOSWITCH=y
