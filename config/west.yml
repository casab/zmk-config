manifest:
  remotes:
    - name: zmkfirmware
      url-base: https://github.com/zmkfirmware
    - name: casab
      url-base: https://github.com/casab
  projects:
    - name: zmk
      remote: zmkfirmware
      revision: main
      import: app/west.yml
    # AutoSwitch KVM: lets the AutoSwitch app switch this keyboard's Bluetooth profile when the
    # KVM switches computers (https://github.com/casab/zmk-autoswitch).
    - name: zmk-autoswitch
      remote: casab
      revision: main
    # Lower thumb: a layer key that holds Cmd/Win only when held on its own
    # (https://github.com/casab/zmk-lazy-layer-mod).
    - name: zmk-lazy-layer-mod
      remote: casab
      revision: main
    # Per-LED control between the underglow and the strip: disabled LEDs, indicators on top
    # (https://github.com/casab/zmk-rgb-led-overlay).
    - name: zmk-rgb-led-overlay
      remote: casab
      revision: main
    # Gaming LED: color per active layer, on chosen LEDs
    # (https://github.com/casab/zmk-rgb-layer-indicator).
    - name: zmk-rgb-layer-indicator
      remote: casab
      revision: main
    # Bluetooth profile shown on LEDs when it changes
    # (https://github.com/casab/zmk-rgb-ble-indicator).
    - name: zmk-rgb-ble-indicator
      remote: casab
      revision: main
    # Battery level shown on LEDs on a key press
    # (https://github.com/casab/zmk-rgb-battery-indicator).
    - name: zmk-rgb-battery-indicator
      remote: casab
      revision: main
    # Media and screen-brightness keys animate the LEDs
    # (https://github.com/casab/zmk-rgb-media-indicator).
    - name: zmk-rgb-media-indicator
      remote: casab
      revision: main
  self:
    path: config
