manifest:
  remotes:
    - name: zmkfirmware
      url-base: https://github.com/zmkfirmware
    - name: zzeneg
      url-base: https://github.com/zzeneg
    - name: casab
      url-base: https://github.com/casab
  projects:
    - name: zmk
      remote: zmkfirmware
      revision: main
      import: app/west.yml
    # Raw HID transport (USB + Bluetooth) the AutoSwitch module talks over.
    - name: zmk-raw-hid
      remote: zzeneg
      revision: main
    # AutoSwitch KVM: lets the AutoSwitch app switch this keyboard's Bluetooth profile when the
    # KVM switches computers (module in firmware/zmk-autoswitch).
    - name: zmk-autoswitch
      remote: casab
      repo-path: AutoSwitchKVM
      revision: main
  self:
    path: config
